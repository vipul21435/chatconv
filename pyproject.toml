[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatconv"
version = "0.1.0"
description = "Convert chat datasets between formats and report what each conversion loses."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["chat", "dataset", "conversion", "jsonl", "fine-tuning", "tool-calling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/vipul21435/chatconv"

[project.scripts]
chatconv = "chatconv.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/chatconv"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
